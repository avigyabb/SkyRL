# Qwen3-30B-A3B GSPO dual-clip + SDFT (production config)
# - sdft_enabled: true (triggers SDFT data generation in agent runner)
# - task: gwas_variant_prioritization (has get_demonstration method for SDFT teacher)

agent_cls: skyrl_agent.agents.biomni_codeact.BiomniCodeActRubricAgent

sdft_enabled: true

overlong_filter_enabled: true
overlong_filter_threshold: 32768

use_log_heavy: true
log_heavy_freq: 8

task: skyrl_agent.tasks.general_react.utils.DummyReactTask
tools: []

data:
  data_source_key: data_source

generator:
  infer_backend: skyrl-train
  backend_config:
    model_name: Qwen/Qwen3-30B-A3B-Thinking-2507
    api_url: http://localhost:30000

  num_trajectories: 5
  max_iterations: 32
  max_prompt_length: 32768
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 4096
    logprobs: 0
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: true
  qwen3_acc_thinking: true

dispatcher:
  type: async_batch
  scheduler: naive
  max_parallel_agents: 128
  max_eval_parallel_agents: 128
