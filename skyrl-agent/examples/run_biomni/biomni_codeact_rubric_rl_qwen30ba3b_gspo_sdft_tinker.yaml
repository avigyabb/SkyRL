# Qwen3-30B-A3B GSPO + SDFT via Tinker backend
# - sdft_enabled: true (triggers SDFT data generation in agent runner)
# - infer_backend: tinker (uses Tinker LoRA training instead of Megatron)
# - Frozen teacher (no EMA — Tinker does not support EMA weight wrapping)

agent_cls: skyrl_agent.agents.biomni_codeact.BiomniCodeActRubricAgent

sdft_enabled: true

overlong_filter_enabled: true
overlong_filter_threshold: 28000

use_log_heavy: true
log_heavy_freq: 8

task: skyrl_agent.tasks.general_react.utils.DummyReactTask
tools: []

data:
  data_source_key: data_source

generator:
  infer_backend: tinker
  backend_config: null
  num_trajectories: 8
  max_iterations: 50
  max_prompt_length: 28672
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 4096
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 4096
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: true
  qwen3_acc_thinking: true

dispatcher:
  type: async_batch
  scheduler: naive
  max_parallel_agents: 128
  max_eval_parallel_agents: 128
