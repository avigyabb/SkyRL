# DEBUG config: Qwen3-30B-A3B SDFT-only (no RL policy loss)
# - sdft_enabled: true, policy_loss_coef: 0.0
# - num_trajectories: 1 (no RL advantage estimation needed)
# - full_vocab KL estimator for testing

agent_cls: skyrl_agent.agents.biomni_codeact.BiomniCodeActRubricAgent

sdft_enabled: true

overlong_filter_enabled: true
overlong_filter_threshold: 32768

use_log_heavy: true
log_heavy_freq: 1

task: skyrl_agent.tasks.general_react.utils.DummyReactTask
tools: []

data:
  data_source_key: data_source

generator:
  infer_backend: skyrl-train
  backend_config:
    model_name: Qwen/Qwen3-30B-A3B-Thinking-2507
    api_url: http://localhost:30000

  num_trajectories: 1
  max_iterations: 50
  max_prompt_length: 32768
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 4096
    logprobs: 0
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: true
  qwen3_acc_thinking: true

dispatcher:
  type: async_batch
  scheduler: naive
  max_parallel_agents: 64
  max_eval_parallel_agents: 64
